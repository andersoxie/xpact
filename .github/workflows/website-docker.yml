# Builds the XPact website as a Windows container and publishes it to
# ghcr.io/andersoxie/xpact-website (issue #233).
#
# The parser DLLs need EiffelStudio + MSVC, which GitHub runners do not have, so the image is
# built from a website build published as a GitHub release (website\scripts\build-dll.ps1 +
# publish.ps1 on the student PC, zipped as xpact-website-dist.zip). To ship a new site:
# create a new release with that zip, change WEBSITE_RELEASE below, and push.
#
# Pull requests build and smoke-test the image; only a push to incremental-test publishes it.
name: Website Docker image

on:
  pull_request:
    paths: [".github/workflows/website-docker.yml", "website/Dockerfile"]
  push:
    branches: [incremental-test]
    paths: [".github/workflows/website-docker.yml", "website/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  WEBSITE_RELEASE: website-2026-11-11-1
  IMAGE: ghcr.io/andersoxie/xpact-website

jobs:
  image:
    # Windows Server 2022: matches the Dockerfile's default base image (ltsc2022).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download the website build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:WEBSITE_RELEASE -R $env:GITHUB_REPOSITORY -p xpact-website-dist.zip -D $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\xpact-website-dist.zip" -DestinationPath dist
          Get-Content dist\BUILD-INFO.txt

      - name: Build the image
        shell: pwsh
        run: |
          docker build -f website\Dockerfile `
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} `
            --label org.opencontainers.image.revision=${{ github.sha }} `
            --label org.opencontainers.image.version=$env:WEBSITE_RELEASE `
            -t "${env:IMAGE}:$env:WEBSITE_RELEASE" -t "${env:IMAGE}:latest" dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke test (the worker and the DLL run inside the container)
        shell: pwsh
        run: |
          docker run -d --name xpact -p 5099:8080 --memory 4g "${env:IMAGE}:latest"
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://localhost:5099/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { docker logs xpact; throw "the site did not answer /api/health" }
          $info = Invoke-RestMethod http://localhost:5099/api/info
          $info | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:5099/api/validate -ContentType "application/xml" -Body "<root/>junk"
          "verdict=$($r.verdict) code=$($r.error.code)"
          if ($r.verdict -ne "rejected" -or $r.error.code -ne 9) { docker logs xpact; throw "expected rejected, code 9" }
          $a = Invoke-RestMethod -Method Post -Uri http://localhost:5099/api/validate -ContentType "application/xml" -Body '<a x="1">hi</a>'
          "verdict=$($a.verdict)"
          if ($a.verdict -ne "accepted") { docker logs xpact; throw "expected accepted" }
          if ((Invoke-WebRequest -UseBasicParsing http://localhost:5099/).StatusCode -ne 200) { throw "home page did not load" }

          # website/docs/docker.md checklist (#284): both builds available, container healthy.
          foreach ($b in $info.builds) { if (-not $b.available) { throw "build $($b.name) is not available" } }
          $health = ""
          foreach ($i in 1..30) {
            $health = docker inspect -f "{{.State.Health.Status}}" xpact
            if ($health -eq "healthy") { break }
            Start-Sleep 5
          }
          "health=$health"
          if ($health -ne "healthy") { docker logs xpact; throw "the container did not become healthy" }
          docker rm -f xpact

      - name: Memory cap inside the container (Job Object nested in the container's job)
        shell: pwsh
        run: |
          # Nested entities, 10 levels x 10 (#211, #227): rejected under the normal 512 MB cap,
          # but the worker needs more than 40 MB on the way, so a 40 MB cap must stop it: either the DLL reports
          # out of memory (rejected, code 1, #273) or, in this container, the worker dies of a stack overflow
          # first (crashed, #316). Both mean the cap worked; the document must never be accepted.
          $sb = [Text.StringBuilder]::new('<!DOCTYPE r [<!ENTITY a0 "xxxxxxxxxx">')
          foreach ($i in 1..9) { [void]$sb.Append("<!ENTITY a$i `"").Append(("&a$($i - 1);" * 10)).Append('">') }
          $laughs = $sb.Append(']><r>&a9;</r>').ToString()
          function Start-Site($name, $port, [string[]] $extra) {
            docker run -d --name $name -p "${port}:8080" --memory 4g @extra "${env:IMAGE}:latest" | Out-Null
            foreach ($i in 1..60) { try { Invoke-RestMethod "http://localhost:$port/api/health" | Out-Null; return } catch { Start-Sleep 2 } }
            docker logs $name; throw "$name did not start"
          }
          function Send($port, $xml) { Invoke-RestMethod -Method Post -Uri "http://localhost:$port/api/validate" -ContentType "application/xml" -Body $xml }
          Start-Site normal 5101 @()
          Start-Site capped 5102 @("-e", "Xpact__WorkerMemoryMb=40")
          $n = Send 5101 $laughs; "512 MB cap: verdict=$($n.verdict)"
          $s = Send 5102 '<a/>';  "40 MB cap, tiny document: verdict=$($s.verdict)"
          $c = Send 5102 $laughs; "40 MB cap, nested entities: verdict=$($c.verdict) code=$($c.error.code)"
          $after = Send 5102 '<a/>'; "40 MB cap, afterwards: verdict=$($after.verdict)"
          # The worker's own error output goes to the server log only (#283): show it, to see where memory ran out.
          docker logs capped 2>&1 | Select-String -Pattern "Worker error output|warn|fail" -Context 0,12 | Select-Object -First 3
          docker rm -f normal capped | Out-Null
          if ($n.verdict -ne "rejected") { throw "expected rejected under the 512 MB cap" }
          if ($s.verdict -ne "accepted") { throw "a tiny document must still work under a 40 MB cap" }
          $stopped = ($c.verdict -eq "rejected" -and $c.error.code -eq 1) -or $c.verdict -eq "crashed"
          if (-not $stopped) { throw "expected the 40 MB cap to stop the document (rejected code 1, or crashed: #316), got $($c.verdict) $($c.error.code)" }
          if ($after.verdict -ne "accepted") { throw "the site must keep serving after the worker was stopped" }

      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/incremental-test'
        shell: pwsh
        run: |
          "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "${env:IMAGE}:$env:WEBSITE_RELEASE"
          docker push "${env:IMAGE}:latest"
