# Secret scan with Gitleaks (#425): the whole git history on every push and pull request.
# Uses the released binary (pinned version and SHA-256), so no account or licence is needed.
# Known-safe patterns (source file checksums in result JSON) are listed in .gitleaks.toml.
name: Gitleaks

on:
  push:
    branches: [incremental-test]
  pull_request:
    branches: [incremental-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
