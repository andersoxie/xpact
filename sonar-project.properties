# SonarQube project configuration for xpact.
sonar.projectKey=xpact
sonar.projectName=xpact
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.e,tests/**/*.c,tests/**/*.h,tests/**/*.ps1

# reports/ and student/results/ hold frozen evidence (probe scripts, logs, inputs) kept as
# they were run; they are not maintained code (#325). node_modules/ and website/dist/ are
# third-party or generated.
sonar.exclusions=EIFGENs/**,build/**,dist/**,.git/**,.tmp/**,coverage/**,tests/**,**/*.obj,exception_trace.log,reports/**,student/results/**,**/node_modules/**,website/dist/**
